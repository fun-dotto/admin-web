name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment_name:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment_name }}
  cancel-in-progress: true
jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      service_name: ${{ steps.set-env.outputs.service_name }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Environmet
        id: set-env
        run: |
          # Environment
          IS_WORKFLOW_DISPATCH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name != '' }}"
          IS_PUSH_TO_MAIN="${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}"
          if [ $IS_WORKFLOW_DISPATCH = "true" ]; then
            export TARGET_ENVIRONMENT="${{ github.event.inputs.environment_name }}"
          elif [ $IS_PUSH_TO_MAIN = "true" ]; then
            export TARGET_ENVIRONMENT="stg"
          else
            exit 1
          fi

          echo "Environment: $TARGET_ENVIRONMENT"

          # Service name suffix
          if [ "$TARGET_ENVIRONMENT" = "prd" ]; then
            export SERVICE_NAME_SUFFIX=""
          else
            export SERVICE_NAME_SUFFIX="-$TARGET_ENVIRONMENT"
          fi

          export REPO_NAME=$(echo ${{ github.repository }} | awk -F '/' '{print $2}')
          export SERVICE_NAME=$REPO_NAME$SERVICE_NAME_SUFFIX
          export IMAGE_TAG=${{ vars._AR_HOSTNAME }}/${{ vars.PROJECT_ID }}/github-actions/$REPO_NAME/$SERVICE_NAME:${{ github.sha }}

          echo "Repository name: $REPO_NAME"
          echo "Service name: $SERVICE_NAME"
          echo "Image tag: $IMAGE_TAG"

          echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: ${{ needs.set-env.outputs.service_name }}
      IMAGE_TAG: ${{ needs.set-env.outputs.image_tag }}
    needs:
      - set-env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build \
          -t ${{ env.IMAGE_TAG }} \
          . \
          -f Dockerfile \
          --no-cache
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.PROJECT_ID }}
      - name: Configure Docker
        run: |
          gcloud auth \
          configure-docker \
          ${{ vars._AR_HOSTNAME }}
      - name: Push
        run: |
          docker push \
          ${{ env.IMAGE_TAG }}
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: ${{ needs.set-env.outputs.environment }}
    env:
      SERVICE_NAME: ${{ needs.set-env.outputs.service_name }}
      IMAGE_TAG: ${{ needs.set-env.outputs.image_tag }}
    needs:
      - set-env
      - build-and-push
    steps:
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_TAG }}
          region: ${{ vars._DEPLOY_REGION }}
          env_vars: |
            ADMIN_API_BASE_URL_PRODUCTION=${{ vars.ADMIN_API_BASE_URL_PRODUCTION }}
            ADMIN_API_BASE_URL_STAGING=${{ vars.ADMIN_API_BASE_URL_STAGING }}
            ADMIN_API_BASE_URL_DEVELOPMENT=${{ vars.ADMIN_API_BASE_URL_DEVELOPMENT }}
          env_vars_update_strategy: overwrite
