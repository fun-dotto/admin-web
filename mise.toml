[settings]
minimum_release_age = "24h"

[tools]
buf = "1.75.0"
bun = "1.4.4"
"npm:portless" = "0.15.12"
"npm:rulesync" = "43.4.0"

[tasks.bootstrap]
description = "依存関係をセットアップする"
run = [{ task = "rulesync" }, "bun install"]

[tasks.rulesync]
description = "rulesyncの設定を生成する"
run = "rulesync generate"

[tasks."app:run:dev"]
description = "portless経由で開発サーバーを起動する"
run = "portless dotto-admin bun run dev"

[tasks."docker:build"]
description = "Dockerfileをビルドする"
run = "docker build . -t dotto-admin-web"

[tasks."docker:run"]
description = "Docker Imageを実行する"
run = "docker run --rm -p 8080:8080 --name dotto-admin-web dotto-admin-web"
